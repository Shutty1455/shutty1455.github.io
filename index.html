<title>Pulverhang</title>

<style>
html,body{height:100%;margin:0;background:#0a0a0a;color:#f5f5f5;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.g{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(340px,100%);display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo b{font-size:32px;font-weight:700;letter-spacing:-.035em}
p{margin:0;color:#8f8f8f;font-size:13px;text-align:center}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:#8f8f8f}
input[type=text]{font:600 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:#f5f5f5;background:none;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:11px;outline:none}
input[type=text]:focus{border-color:#fff}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:#f5f5f5;cursor:pointer}
.chk input{accent-color:#fff;width:15px;height:15px;margin:0}
button{all:unset;box-sizing:border-box;text-align:center;cursor:pointer;background:#fff;color:#0a0a0a;font-weight:600;font-size:14px;border-radius:4px;padding:11px 16px}
button:hover{background:#e2e2e2}button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.err{color:#f5f5f5;font-weight:500;font-size:13px;border-left:2px solid #fff;padding-left:8px;text-align:left}
.err:empty{display:none}
.st{min-height:1.3em}
</style>

  function u2b(u){var s='';for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
  function norm(c){return c.toUpperCase().replace(/[^A-Z0-9]/g,'')}
  var cs=window.crypto&&crypto.subtle;
  function showForm(msg){st.textContent='';f.hidden=false;if(msg)err.textContent=msg;setTimeout(function(){inp.focus()},30)}
  if(!cs||typeof DecompressionStream==='undefined'){st.textContent='This browser is too old for Pulverhang. Please update it (Chrome, Edge, Firefox or Safari 16.4 or newer).';return}
  async function unlockWith(raw){
    var key=await cs.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    var gz=await cs.decrypt({name:'AES-GCM',iv:b64(META.iv),additionalData:enc.encode(META.b)},key,b64(DATA));
    var ds=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(ds).text();
  }
  function run(html){st.textContent='';document.open('text/html','replace');document.write(html);document.close()}
  async function tryCode(code){
    var base=await cs.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
    var kek=await cs.deriveKey({name:'PBKDF2',salt:b64(META.s),iterations:META.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    for(var i=0;i<META.slots.length;i++){
      try{var k=await cs.decrypt({name:'AES-GCM',iv:b64(META.slots[i].i),additionalData:enc.encode('pulverhang-slot')},kek,b64(META.slots[i].w));return new Uint8Array(k)}catch(e){}
    }
    return null;
  }
  f.addEventListener('submit',async function(ev){
    ev.preventDefault();err.textContent='';var code=norm(inp.value);
    if(code.length!==12){err.textContent='The code has 12 characters, for example ABCD-EFGH-JKLM.';return}
    go.disabled=true;go.textContent='Checking …';
    try{
      var k=await tryCode(code);
      if(!k){err.textContent='This code is not valid.';go.disabled=false;go.textContent='Unlock';inp.select();return}
      go.textContent='Unlocking …';var html=await unlockWith(k);
      if(document.getElementById('r').checked){try{localStorage.setItem(KEY,JSON.stringify({b:META.b,k:u2b(k)}))}catch(e){}}
      else{try{localStorage.removeItem(KEY)}catch(e){}}
      run(html);
    }catch(e){err.textContent='Unlocking failed. Please reload the page and try again.';go.disabled=false;go.textContent='Unlock'}
  });
  inp.addEventListener('input',function(){var v=norm(inp.value).slice(0,12);var o=v.replace(/(.{4})(?=.)/g,'$1-');if(o!==inp.value)inp.value=o});
  var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(saved&&saved.b===META.b&&saved.k){st.textContent='Loading …';unlockWith(b64(saved.k)).then(run).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}showForm()})}
  else{if(saved){try{localStorage.removeItem(KEY)}catch(e){}}showForm()}
})();
</script>
</body>
