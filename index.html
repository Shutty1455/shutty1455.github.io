<title>Pulverhang</title>

<style>
html,body{height:100%;margin:0;background:#0a0a0a;color:#f5f5f5;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.g{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(340px,100%);display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo b{font-size:32px;font-weight:700;letter-spacing:-.035em}
p{margin:0;color:#8f8f8f;font-size:13px;text-align:center}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:#8f8f8f}
input[type=text]{font:600 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:#f5f5f5;background:none;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:11px;outline:none}
input[type=text]:focus{border-color:#fff}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:#f5f5f5;cursor:pointer}
.chk input{accent-color:#fff;width:15px;height:15px;margin:0}
button{all:unset;box-sizing:border-box;text-align:center;cursor:pointer;background:#fff;color:#0a0a0a;font-weight:600;font-size:14px;border-radius:4px;padding:11px 16px}
button:hover{background:#e2e2e2}button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.err{color:#f5f5f5;font-weight:500;font-size:13px;border-left:2px solid #fff;padding-left:8px;text-align:left}
.err:empty{display:none}
.st{min-height:1.3em}
</style>
